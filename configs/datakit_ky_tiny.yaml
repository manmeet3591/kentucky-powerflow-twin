# Local sanity check only: 4 load scenarios x 2 topologies.
network: {name: "ky_case", source: "file", network_dir: "data/grid/datakit"}
load: {generator: "agg_load_profile", agg_profile: "lgee_2023_2024", scenarios: 4, sigma: 0.05,
       change_reactive_power: true, global_range: 0.6, max_scaling_factor: 1.3, step_size: 0.05,
       start_scaling_factor: 1.0}
topology_perturbation: {type: "random", k: 1, n_topology_variants: 2, elements: [branch]}
generation_perturbation: {type: "none"}
admittance_perturbation: {type: "none"}
settings: {num_processes: 2, process_backend: "process_pool_executor", enable_checkpointing: false,
           data_dir: "data/datakit_tiny", large_chunk_size: 4, overwrite: true, mode: "pf",
           include_dc_res: true, enable_solver_logs: false, pf_fast: true, dcpf_fast: true,
           pf_solver: "powermodel", opf_formulation: "polar", max_iter: 200,
           coinhsl: {enabled: false, linear_solver: "ma57", hsllib: ""}, seed: 42}
